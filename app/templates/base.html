<!DOCTYPE html>
<html lang="zh-CN" class="bg-zinc-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}上游价格监控{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media (max-width: 640px) {
      .desktop-only { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-16 sm:pb-0">

  <!-- 桌面端顶栏 -->
  <header class="hidden sm:block bg-white/80 backdrop-blur border-b border-zinc-200/60 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
          <span class="text-white text-xs font-bold">￥</span>
        </div>
        <h1 class="text-sm font-semibold text-zinc-800 tracking-tight">上游价格监控</h1>
      </div>
      <nav class="flex gap-1 items-center">
        <a href="/" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 transition-colors">总览</a>
        <a href="/sites" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-500 hover:text-zinc-800 hover:bg-zinc-100 transition-colors">站点</a>
        <a href="/docs" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:text-zinc-600 hover:bg-zinc-100 transition-colors">API</a>
        <span class="w-px h-4 bg-zinc-200 mx-1"></span>
        <a href="/logout" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:text-red-500 hover:bg-red-50 transition-colors">退出</a>
      </nav>
    </div>
  </header>

  <!-- 移动端顶栏 -->
  <header class="sm:hidden bg-white border-b border-zinc-100 sticky top-0 z-30 px-4 h-12 flex items-center justify-between">
    <h1 class="text-sm font-semibold text-zinc-800">上游价格监控</h1>
    <div class="flex gap-2">
      <a href="/" class="text-xs font-medium text-blue-600">总览</a>
      <a href="/sites" class="text-xs font-medium text-zinc-400">站点</a>
      <a href="/logout" class="text-xs font-medium text-zinc-300">退出</a>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="flex-1 px-3 sm:px-6 py-4 sm:py-6 max-w-6xl mx-auto w-full">
    {% block content %}{% endblock %}
  </main>

  <!-- 移动端底部导航栏 -->
  <nav class="sm:hidden fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur border-t border-zinc-200/60 z-30 safe-area-bottom">
    <div class="flex h-14">
      <a href="/" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-blue-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="text-[10px] font-medium">总览</span>
      </a>
      <a href="/sites" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-zinc-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="text-[10px] font-medium">站点</span>
      </a>
      <a href="/docs" target="_blank" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-zinc-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span class="text-[10px] font-medium">API</span>
      </a>
    </div>
  </nav>

</body>
</html>
