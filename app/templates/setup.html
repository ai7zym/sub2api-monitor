<!DOCTYPE html>
<html lang="zh-CN" class="bg-zinc-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>初始化设置 - 上游价格监控</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-zinc-50 px-4 py-8">
  <div class="w-full max-w-lg">
    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center mx-auto mb-3">
        <span class="text-white text-lg font-bold">￥</span>
      </div>
      <h1 class="text-lg font-semibold text-zinc-800">初始化设置</h1>
      <p class="text-xs text-zinc-400 mt-1" id="step-desc">配置数据库连接</p>
    </div>

    <!-- 步骤指示器 -->
    <div class="flex items-center justify-center gap-1 mb-6">
      <div class="step-dot w-8 h-8 rounded-full bg-blue-600 text-white text-xs font-medium flex items-center justify-center transition-colors" data-step="1">1</div>
      <div class="w-8 h-px bg-zinc-200"></div>
      <div class="step-dot w-8 h-8 rounded-full bg-zinc-200 text-zinc-400 text-xs font-medium flex items-center justify-center transition-colors" data-step="2">2</div>
      <div class="w-8 h-px bg-zinc-200"></div>
      <div class="step-dot w-8 h-8 rounded-full bg-zinc-200 text-zinc-400 text-xs font-medium flex items-center justify-center transition-colors" data-step="3">3</div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-zinc-100 overflow-hidden">
      <!-- 步骤1: 数据库配置 -->
      <form id="step1" class="p-6 space-y-4">
        <h3 class="text-sm font-semibold text-zinc-700">配置数据库</h3>

        <!-- 输入模式切换 -->
        <div class="flex bg-zinc-100 rounded-lg p-1 gap-1">
          <button type="button" onclick="switchDbMode('fields')" id="tab-fields" class="flex-1 py-1.5 text-xs font-medium rounded-md bg-white text-zinc-700 shadow-sm transition-colors">分字段填写</button>
          <button type="button" onclick="switchDbMode('string')" id="tab-string" class="flex-1 py-1.5 text-xs font-medium rounded-md text-zinc-400 hover:text-zinc-600 transition-colors">连接串</button>
        </div>

        <!-- 分字段模式 -->
        <div id="db-fields-mode" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <label class="flex flex-col gap-1">
              <span class="text-[11px] text-zinc-400 font-medium">主机</span>
              <input id="db-host" placeholder="localhost" value="localhost" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
            </label>
            <label class="flex flex-col gap-1">
              <span class="text-[11px] text-zinc-400 font-medium">端口</span>
              <input id="db-port" placeholder="5432" value="5432" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
            </label>
          </div>
          <label class="flex flex-col gap-1">
            <span class="text-[11px] text-zinc-400 font-medium">用户名</span>
            <input id="db-user" placeholder="postgres" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-[11px] text-zinc-400 font-medium">密码</span>
            <input id="db-pass" type="password" placeholder="留空则无密码" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-[11px] text-zinc-400 font-medium">数据库名</span>
            <input id="db-name" placeholder="price_monitor" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
          </label>
        </div>

        <!-- 连接串模式 -->
        <div id="db-string-mode" class="space-y-3 hidden">
          <label class="flex flex-col gap-1">
            <span class="text-[11px] text-zinc-400 font-medium">连接串</span>
            <input id="db-url" placeholder="postgresql://user:pass@localhost:5432/dbname"
              class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all font-mono">
          </label>
        </div>

        <div id="db-msg" class="hidden text-xs px-3 py-2 rounded-xl"></div>
        <div class="flex gap-2">
          <button type="button" onclick="testDb()" class="flex-1 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 border-0 py-2.5 rounded-xl text-sm font-medium transition-colors">测试连接</button>
          <button type="button" onclick="nextStep(2)" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white border-0 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-sm shadow-blue-600/20">下一步</button>
        </div>
        <div id="sqlite-fallback" class="hidden pt-2 border-t border-zinc-100">
          <p class="text-xs text-zinc-400 mb-2">PostgreSQL 连接失败，可降级使用本地 SQLite：</p>
          <button type="button" onclick="useSqlite()" class="text-xs text-amber-600 font-medium hover:text-amber-700">使用 SQLite（本机文件数据库）</button>
        </div>
      </form>

      <!-- 步骤2: 管理员账号 -->
      <form id="step2" class="p-6 space-y-4 hidden">
        <h3 class="text-sm font-semibold text-zinc-700">创建管理员</h3>
        <label class="flex flex-col gap-1">
          <span class="text-[11px] text-zinc-400 font-medium">邮箱</span>
          <input id="admin-email" type="email" required class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-[11px] text-zinc-400 font-medium">密码</span>
          <input id="admin-password" type="password" required minlength="6" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-[11px] text-zinc-400 font-medium">确认密码</span>
          <input id="admin-password2" type="password" required minlength="6" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
        </label>
        <div class="flex gap-2">
          <button type="button" onclick="nextStep(1)" class="flex-1 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 border-0 py-2.5 rounded-xl text-sm font-medium transition-colors">上一步</button>
          <button type="button" onclick="nextStep(3)" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white border-0 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-sm shadow-blue-600/20">下一步</button>
        </div>
      </form>

      <!-- 步骤3: 站点 + 完成 -->
      <form id="step3" class="p-6 space-y-4 hidden">
        <h3 class="text-sm font-semibold text-zinc-700">初始化站点 <span class="text-zinc-300 font-normal text-xs">（可跳过）</span></h3>
        <div class="space-y-2">
          <label class="flex flex-col gap-1">
            <span class="text-[11px] text-zinc-400 font-medium">域名</span>
            <input id="site-domain" placeholder="sub.example.xyz" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
          </label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex flex-col gap-1">
              <span class="text-[11px] text-zinc-400 font-medium">邮箱</span>
              <input id="site-email" type="email" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
            </label>
            <label class="flex flex-col gap-1">
              <span class="text-[11px] text-zinc-400 font-medium">密码</span>
              <input id="site-password" type="password" class="px-3 py-2.5 border border-zinc-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all">
            </label>
          </div>
        </div>
        <div id="finish-msg" class="hidden text-xs px-3 py-2 rounded-xl"></div>
        <div class="flex gap-2">
          <button type="button" onclick="nextStep(2)" class="flex-1 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 border-0 py-2.5 rounded-xl text-sm font-medium transition-colors">上一步</button>
          <button type="button" onclick="complete()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white border-0 py-2.5 rounded-xl text-sm font-medium transition-colors shadow-sm shadow-blue-600/20">完成设置</button>
        </div>
      </form>
    </div>
  </div>

<script>
let currentStep = 1;
let dbTested = false;
let dbUrl = '';
let dbMode = 'fields';

function switchDbMode(mode) {
  dbMode = mode;
  document.getElementById('db-fields-mode').classList.toggle('hidden', mode !== 'fields');
  document.getElementById('db-string-mode').classList.toggle('hidden', mode !== 'string');
  document.getElementById('tab-fields').className = mode === 'fields'
    ? 'flex-1 py-1.5 text-xs font-medium rounded-md bg-white text-zinc-700 shadow-sm transition-colors'
    : 'flex-1 py-1.5 text-xs font-medium rounded-md text-zinc-400 hover:text-zinc-600 transition-colors';
  document.getElementById('tab-string').className = mode === 'string'
    ? 'flex-1 py-1.5 text-xs font-medium rounded-md bg-white text-zinc-700 shadow-sm transition-colors'
    : 'flex-1 py-1.5 text-xs font-medium rounded-md text-zinc-400 hover:text-zinc-600 transition-colors';
  dbTested = false;
  document.getElementById('db-msg').classList.add('hidden');
}

function buildDbUrl() {
  if (dbMode === 'string') {
    return document.getElementById('db-url').value.trim();
  }
  const host = document.getElementById('db-host').value.trim() || 'localhost';
  const port = document.getElementById('db-port').value.trim() || '5432';
  const user = document.getElementById('db-user').value.trim() || 'postgres';
  const pass = document.getElementById('db-pass').value.trim();
  const dbname = document.getElementById('db-name').value.trim() || 'price_monitor';
  const auth = pass ? user + ':' + encodeURIComponent(pass) : user;
  return 'postgresql://' + auth + '@' + host + ':' + port + '/' + dbname;
}

function setStep(n) {
  document.querySelectorAll('#step1, #step2, #step3').forEach(el => el.classList.add('hidden'));
  document.getElementById('step' + n).classList.remove('hidden');
  document.querySelectorAll('.step-dot').forEach(d => {
    const s = parseInt(d.dataset.step);
    if (s === n) { d.className = d.className.replace(/bg-\S+/, 'bg-blue-600').replace(/text-\S+/, 'text-white'); }
    else if (s < n) { d.className = d.className.replace(/bg-\S+/, 'bg-emerald-500').replace(/text-\S+/, 'text-white'); }
    else { d.className = d.className.replace(/bg-\S+/, 'bg-zinc-200').replace(/text-\S+/, 'text-zinc-400'); }
  });
  const descs = ['配置数据库连接', '创建管理员账号', '初始化监控站点（可选）'];
  document.getElementById('step-desc').textContent = descs[n-1];
  currentStep = n;
}

function nextStep(n) {
  if (n === 2) {
    dbUrl = buildDbUrl();
    if (!dbUrl) { alert('请填写数据库连接信息'); return; }
    if (!dbTested && dbUrl.startsWith('postgres')) { alert('请先点击"测试连接"'); return; }
  }
  if (n === 3) {
    const email = document.getElementById('admin-email').value.trim();
    const pwd = document.getElementById('admin-password').value;
    const pwd2 = document.getElementById('admin-password2').value;
    if (!email || !pwd) { alert('请填写邮箱和密码'); return; }
    if (pwd.length < 6) { alert('密码至少6位'); return; }
    if (pwd !== pwd2) { alert('两次密码不一致'); return; }
  }
  setStep(n);
}

async function testDb() {
  const url = buildDbUrl();
  const msg = document.getElementById('db-msg');
  const fallback = document.getElementById('sqlite-fallback');
  if (!url) { alert('请填写连接信息'); return; }
  msg.classList.remove('hidden');
  msg.className = 'text-xs px-3 py-2 rounded-xl bg-zinc-50 text-zinc-600';
  msg.textContent = '测试连接中...';
  try {
    const r = await fetch('/api/setup/test-db', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({database_url: url})
    });
    const d = await r.json();
    if (d.ok) {
      msg.className = 'text-xs px-3 py-2 rounded-xl bg-emerald-50 text-emerald-600';
      msg.textContent = '连接成功';
      dbTested = true;
      dbUrl = url;
      fallback.classList.add('hidden');
    } else {
      msg.className = 'text-xs px-3 py-2 rounded-xl bg-red-50 text-red-600';
      msg.textContent = '连接失败: ' + d.error;
      dbTested = false;
      fallback.classList.remove('hidden');
    }
  } catch(e) {
    msg.className = 'text-xs px-3 py-2 rounded-xl bg-red-50 text-red-600';
    msg.textContent = '请求异常: ' + e;
    dbTested = false;
    fallback.classList.remove('hidden');
  }
}

function useSqlite() {
  dbUrl = 'sqlite:///data/price_monitor.db';
  document.getElementById('db-url').value = dbUrl;
  document.getElementById('db-msg').classList.remove('hidden');
  document.getElementById('db-msg').className = 'text-xs px-3 py-2 rounded-xl bg-emerald-50 text-emerald-600';
  document.getElementById('db-msg').textContent = '已选择 SQLite（本地文件数据库）';
  document.getElementById('sqlite-fallback').classList.add('hidden');
  dbTested = true;
}

async function complete() {
  const email = document.getElementById('admin-email').value.trim();
  const pwd = document.getElementById('admin-password').value;
  const pwd2 = document.getElementById('admin-password2').value;
  if (!email || !pwd) { alert('请填写邮箱和密码'); return; }
  if (pwd.length < 6) { alert('密码至少6位'); return; }
  if (pwd !== pwd2) { alert('两次密码不一致'); return; }

  // 收集站点（如果有）
  const sDomain = document.getElementById('site-domain').value.trim();
  let sites = [];
  if (sDomain) {
    sites.push({
      domain: sDomain,
      email: document.getElementById('site-email').value.trim(),
      password: document.getElementById('site-password').value,
      enabled: true
    });
  }

  const btn = document.querySelector('#step3 button:last-child');
  btn.disabled = true; btn.textContent = '初始化中...';

  try {
    const r = await fetch('/api/setup/complete', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({
        database_url: dbUrl,
        email: email,
        password: pwd,
        sites: sites
      })
    });
    const d = await r.json();
    if (d.ok) {
      window.location.href = '/login';
    } else {
      const msg = document.getElementById('finish-msg');
      msg.classList.remove('hidden');
      msg.className = 'text-xs px-3 py-2 rounded-xl bg-red-50 text-red-600';
      msg.textContent = '初始化失败: ' + (d.error || '未知错误');
      btn.disabled = false; btn.textContent = '完成设置';
    }
  } catch(e) {
    alert('请求异常: ' + e);
    btn.disabled = false; btn.textContent = '完成设置';
  }
}
</script>
</body>
</html>
